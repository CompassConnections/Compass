name: Setup
description: Checkout, cache and install dependencies

runs:
  using: composite
  steps:
    - name: Cache node_modules
      id: cache-node-modules
      uses: actions/cache@v4
      with:
        path: |
          node_modules
          web/node_modules
          backend/api/node_modules
          backend/shared/node_modules
          backend/email/node_modules
          common/node_modules
        # The package.json files are part of the key, not just the lockfile: adding a dependency
        # whose exact version another workspace already pins leaves yarn.lock byte-identical, and
        # keying on the lockfile alone would then restore a node_modules that never installed it.
        # node_modules doesn't exist yet at this point, but exclude it so that stays true.
        #
        # `runner.os`/`runner.arch` are load-bearing. GitHub does not namespace caches by runner, so
        # without them the Linux jobs' node_modules is restored onto the macOS runner in cd-ios.yml —
        # bringing Linux-only native binaries with it. The visible symptom was `capacitor-assets`
        # dying on a missing `sharp-darwin-arm64v8.node`.
        #
        # Since the root `resolutions` pin of sharp to ^0.34.5, the platform binary arrives as a
        # normal optionalDependency (`@img/sharp-<platform>`) that yarn resolves per runner, rather
        # than through a postinstall download a cache hit would skip. That makes the cross-runner
        # failure much less likely — but the keys stay, because a cache restored across
        # architectures is wrong on principle and this is the only thing preventing it.
        key: node-modules-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/yarn.lock', '**/package.json', '!**/node_modules/**') }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install dependencies
      if: steps.cache-node-modules.outputs.cache-hit != 'true'
      run: yarn install --frozen-lockfile
      shell: bash

    - name: Post-install
      if: steps.cache-node-modules.outputs.cache-hit == 'true'
      run: yarn postinstall
      shell: bash
